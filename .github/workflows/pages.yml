name: Build deployable site artifact
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npx --yes npm@11 ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload deployable site
        uses: actions/upload-artifact@v4
        with:
          name: racegame-dist-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
