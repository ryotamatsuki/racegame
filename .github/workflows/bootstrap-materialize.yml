name: Materialize and verify implementation
on:
  push:
    branches: [implementation/browser-racer-v1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: implementation/browser-racer-v1
          fetch-depth: 0
      - name: Reconstruct implementation archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/payload-current.part.* | base64 -d > /tmp/racegame-current.tgz
          echo "cce9d1ddd97f74f125191981c5b65c66d52df1ce9717684fda6afce4b289917c  /tmp/racegame-current.tgz" | sha256sum -c -
          tar xzf /tmp/racegame-current.tgz -C .
          rm -f bootstrap/payload-current.part.* bootstrap/source.part.*
      - name: Apply browser lifecycle and mobile layout fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app_path=Path('src/ui/App.tsx')
          app=app_path.read_text()
          old="""function RaceCanvas({courseId,mode,machineId,setup,seed,quality,reducedMotion,audio,onHud,onDone,onPaused,onLost,controlRef}:{courseId:CourseId;mode:GameMode;machineId:MachineId;setup:Setup;seed:number;quality:Quality;reducedMotion:boolean;audio:AudioManager;onHud:(h:HudInfo)=>void;onDone:(r:RaceResult,p:{samples:number;medianMs:number;p95Ms:number})=>void;onPaused:()=>void;onLost:()=>void;controlRef:MutableRefObject<RaceScene|null>}){
            const host=useRef<HTMLDivElement>(null);
            useEffect(()=>{if(!host.current)return;const engine=new RaceEngine({courseId,mode,playerMachineId:machineId,playerSetup:setup,seed});let scene:RaceScene;scene=new RaceScene(host.current,engine,audio,quality,reducedMotion,onHud,(r)=>onDone(r,scene.getPerformance()),onPaused,onLost);controlRef.current=scene;return()=>{scene.dispose();controlRef.current=null;};},[courseId,mode,machineId,setup,seed,quality,reducedMotion,audio,onHud,onDone,onPaused,onLost,controlRef]);
            return <div className=\"viewport race-viewport\" ref={host} data-testid=\"race-3d\"/>;
          }"""
          new="""function RaceCanvas({courseId,mode,machineId,setup,seed,quality,reducedMotion,audio,onHud,onDone,onPaused,onLost,controlRef}:{courseId:CourseId;mode:GameMode;machineId:MachineId;setup:Setup;seed:number;quality:Quality;reducedMotion:boolean;audio:AudioManager;onHud:(h:HudInfo)=>void;onDone:(r:RaceResult,p:{samples:number;medianMs:number;p95Ms:number})=>void;onPaused:()=>void;onLost:()=>void;controlRef:MutableRefObject<RaceScene|null>}){
            const host=useRef<HTMLDivElement>(null);
            const callbacks=useRef({onHud,onDone,onPaused,onLost});
            callbacks.current={onHud,onDone,onPaused,onLost};
            useEffect(()=>{if(!host.current)return;const engine=new RaceEngine({courseId,mode,playerMachineId:machineId,playerSetup:setup,seed});let scene:RaceScene;scene=new RaceScene(host.current,engine,audio,quality,reducedMotion,(h)=>callbacks.current.onHud(h),(r)=>callbacks.current.onDone(r,scene.getPerformance()),()=>callbacks.current.onPaused(),()=>callbacks.current.onLost());controlRef.current=scene;return()=>{scene.dispose();controlRef.current=null;};},[courseId,mode,machineId,setup,seed,quality,reducedMotion,audio,controlRef]);
            return <div className=\"viewport race-viewport\" ref={host} data-testid=\"race-3d\"/>;
          }"""
          if old not in app:
              raise SystemExit('RaceCanvas source anchor not found')
          app_path.write_text(app.replace(old,new))
          css_path=Path('src/styles.css')
          css=css_path.read_text()
          old_media='@media(max-width:900px)'
          if old_media not in css:
              raise SystemExit('mobile media query anchor not found')
          css_path.write_text(css.replace(old_media,'@media(max-width:1024px)',1))
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Keep unit and browser suites separate
        run: npm pkg set 'scripts.test=vitest run tests/simulation.test.ts tests/storage.test.ts'
      - name: Generate deterministic lockfile
        run: npx --yes npm@11 install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean install
        run: npx --yes npm@11 ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and simulation tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - name: Preserve E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-e2e-evidence-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Promote verified workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-materialize.yml .github/workflows/bootstrap-lock.yml
          mkdir -p .github/workflows
          mv bootstrap/ci.yml .github/workflows/ci.yml
          mv bootstrap/pages.yml .github/workflows/pages.yml
          rmdir bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement 3D browser racing game'
          git push origin HEAD:implementation/browser-racer-v1
