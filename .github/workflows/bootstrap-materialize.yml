name: Materialize and verify implementation
on:
  push:
    branches: [implementation/browser-racer-v1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: implementation/browser-racer-v1
          fetch-depth: 0
      - name: Reconstruct implementation archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/payload-current.part.* | base64 -d > /tmp/racegame-current.tgz
          echo "cce9d1ddd97f74f125191981c5b65c66d52df1ce9717684fda6afce4b289917c  /tmp/racegame-current.tgz" | sha256sum -c -
          tar xzf /tmp/racegame-current.tgz -C .
          rm -f bootstrap/payload-current.part.* bootstrap/source.part.*
      - name: Apply verified browser and CI fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path=Path('src/ui/App.tsx')
          app=app_path.read_text()
          old="""function RaceCanvas({courseId,mode,machineId,setup,seed,quality,reducedMotion,audio,onHud,onDone,onPaused,onLost,controlRef}:{courseId:CourseId;mode:GameMode;machineId:MachineId;setup:Setup;seed:number;quality:Quality;reducedMotion:boolean;audio:AudioManager;onHud:(h:HudInfo)=>void;onDone:(r:RaceResult,p:{samples:number;medianMs:number;p95Ms:number})=>void;onPaused:()=>void;onLost:()=>void;controlRef:MutableRefObject<RaceScene|null>}){
            const host=useRef<HTMLDivElement>(null);
            useEffect(()=>{if(!host.current)return;const engine=new RaceEngine({courseId,mode,playerMachineId:machineId,playerSetup:setup,seed});let scene:RaceScene;scene=new RaceScene(host.current,engine,audio,quality,reducedMotion,onHud,(r)=>onDone(r,scene.getPerformance()),onPaused,onLost);controlRef.current=scene;return()=>{scene.dispose();controlRef.current=null;};},[courseId,mode,machineId,setup,seed,quality,reducedMotion,audio,onHud,onDone,onPaused,onLost,controlRef]);
            return <div className=\"viewport race-viewport\" ref={host} data-testid=\"race-3d\"/>;
          }"""
          new="""function RaceCanvas({courseId,mode,machineId,setup,seed,quality,reducedMotion,audio,onHud,onDone,onPaused,onLost,controlRef}:{courseId:CourseId;mode:GameMode;machineId:MachineId;setup:Setup;seed:number;quality:Quality;reducedMotion:boolean;audio:AudioManager;onHud:(h:HudInfo)=>void;onDone:(r:RaceResult,p:{samples:number;medianMs:number;p95Ms:number})=>void;onPaused:()=>void;onLost:()=>void;controlRef:MutableRefObject<RaceScene|null>}){
            const host=useRef<HTMLDivElement>(null);
            const callbacks=useRef({onHud,onDone,onPaused,onLost});
            callbacks.current={onHud,onDone,onPaused,onLost};
            useEffect(()=>{if(!host.current)return;const engine=new RaceEngine({courseId,mode,playerMachineId:machineId,playerSetup:setup,seed});let scene:RaceScene;scene=new RaceScene(host.current,engine,audio,quality,reducedMotion,(h)=>callbacks.current.onHud(h),(r)=>callbacks.current.onDone(r,scene.getPerformance()),()=>callbacks.current.onPaused(),()=>callbacks.current.onLost());controlRef.current=scene;return()=>{scene.dispose();controlRef.current=null;};},[courseId,mode,machineId,setup,seed,quality,reducedMotion,audio,controlRef]);
            return <div className=\"viewport race-viewport\" ref={host} data-testid=\"race-3d\"/>;
          }"""
          if old not in app:
              raise SystemExit('RaceCanvas source anchor not found')
          app_path.write_text(app.replace(old,new))

          race_path=Path('src/game/rendering/RaceScene.ts')
          race=race_path.read_text()
          race=race.replace('if(frame>0.25)frame=0;', 'if(!Number.isFinite(frame)||frame<0)frame=0;frame=Math.min(frame,0.25);')
          race=race.replace('steps<10)', 'steps<30)')
          race=race.replace('if(steps===10)this.accumulator=0;', 'if(steps===30)this.accumulator=Math.min(this.accumulator,FIXED_DT*2);')
          if 'steps<30)' not in race or 'Math.min(frame,0.25)' not in race:
              raise SystemExit('RaceScene frame clamp patch failed')
          race_path.write_text(race)

          css_path=Path('src/styles.css')
          css=css_path.read_text().replace('@media(max-width:900px)','@media(max-width:1024px)',1)
          css += '''\n@media(max-width:1024px){.screen-race,.race-screen,.race-viewport{height:100dvh;min-height:100dvh}.screen-race{overflow:hidden}.stage-tools{z-index:14;left:.6rem;right:auto}.performance-panel{z-index:12}}\n'''
          css_path.write_text(css)

          Path('playwright.config.ts').write_text("""import { defineConfig, devices } from '@playwright/test';
          const publicBase=(globalThis as typeof globalThis & {process?:{env?:Record<string,string|undefined>}}).process?.env?.PLAYWRIGHT_BASE_URL;
          const localBase='http://127.0.0.1:4173/racegame/';
          export default defineConfig({
            testDir:'./tests/e2e', timeout:150_000, expect:{timeout:10_000}, retries:0, workers:1,
            reporter:[['list'],['html',{outputFolder:'playwright-report',open:'never'}]],
            use:{baseURL:publicBase??localBase,trace:'retain-on-failure',screenshot:'only-on-failure'},
            webServer:publicBase?undefined:{command:'npm run dev -- --host 127.0.0.1 --port 4173',url:localBase,reuseExistingServer:false,timeout:120_000},
            projects:[{name:'chromium-desktop',use:{...devices['Desktop Chrome'],viewport:{width:1440,height:900}}},{name:'chromium-mobile',use:{...devices['Pixel 7'],viewport:{width:915,height:412}}}],
          });
          """)

          Path('bootstrap/ci.yml').write_text(("""name: CI
          on:
            pull_request:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-node@v7
                  with:
                    node-version: '22'
                    package-manager-cache: false
                - run: npx --yes npm@11 ci --no-audit --no-fund
                - run: npm run typecheck
                - run: npm test
                - run: npm run build
            e2e:
              needs: verify
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-node@v7
                  with:
                    node-version: '22'
                    package-manager-cache: false
                - run: npx --yes npm@11 ci --no-audit --no-fund
                - name: Install Chromium
                  run: npx playwright install --with-deps chromium
                - name: Browser E2E
                  run: npm run test:e2e
                - name: Upload E2E evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: e2e-evidence-__DOLLAR__{{ github.run_id }}
                    path: |
                      test-results/
                      playwright-report/
                    if-no-files-found: warn
                    retention-days: 14
          """).replace('__DOLLAR__',chr(36)))

          Path('bootstrap/pages.yml').write_text(("""name: Deploy GitHub Pages
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
            pages: write
            id-token: write
          concurrency:
            group: pages
            cancel-in-progress: true
          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-node@v7
                  with:
                    node-version: '22'
                    package-manager-cache: false
                - run: npx --yes npm@11 ci --no-audit --no-fund
                - run: npm run typecheck
                - run: npm test
                - run: npm run build
                - uses: actions/configure-pages@v5
                - uses: actions/upload-pages-artifact@v4
                  with:
                    path: ./dist
            deploy:
              needs: build
              runs-on: ubuntu-latest
              outputs:
                page_url: __DOLLAR__{{ steps.deployment.outputs.page_url }}
              environment:
                name: github-pages
                url: __DOLLAR__{{ steps.deployment.outputs.page_url }}
              steps:
                - name: Deploy
                  id: deployment
                  uses: actions/deploy-pages@v4
            public-smoke:
              needs: deploy
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-node@v7
                  with:
                    node-version: '22'
                    package-manager-cache: false
                - run: npx --yes npm@11 ci --no-audit --no-fund
                - run: npx playwright install --with-deps chromium
                - name: Public Pages E2E
                  env:
                    PLAYWRIGHT_BASE_URL: __DOLLAR__{{ needs.deploy.outputs.page_url }}
                  run: npm run test:e2e
                - name: Upload public smoke evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: public-pages-e2e-__DOLLAR__{{ github.run_id }}
                    path: |
                      test-results/
                      playwright-report/
                    if-no-files-found: warn
                    retention-days: 14
          """).replace('__DOLLAR__',chr(36)))
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Normalize package metadata and test suites
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'scripts.test=vitest run tests/simulation.test.ts tests/storage.test.ts'
          NPM11="$(npx --yes npm@11 --version)"
          npm pkg set "packageManager=npm@${NPM11}"
          echo "Using npm ${NPM11}"
      - name: Generate deterministic lockfile
        run: npx --yes npm@11 install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean install
        run: npx --yes npm@11 ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and simulation tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - name: Preserve E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-e2e-evidence-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Promote verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-materialize.yml .github/workflows/bootstrap-lock.yml
          mkdir -p .github/workflows
          mv bootstrap/ci.yml .github/workflows/ci.yml
          mv bootstrap/pages.yml .github/workflows/pages.yml
          rmdir bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement 3D browser racing game'
          git push origin HEAD:implementation/browser-racer-v1
